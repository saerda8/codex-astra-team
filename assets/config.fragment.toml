# Merge into the existing project config; do not replace unrelated settings.
model = "gpt-6-astra"
model_reasoning_effort = "high"

[features]
multi_agent = true
hooks = true

[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
